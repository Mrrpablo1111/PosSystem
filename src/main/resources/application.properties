spring.application.name=sh-pos-system

# ── Server ─────────────────────────────────────────────────────────────────────
server.port=5500
# ── Database ───────────────────────────────────────────────────────────────────
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3307/pos_system?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:pos_system}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:15052001@Hong}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ── JPA / Hibernate ────────────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=false

# ── Redis ──────────────────────────────────────────────────────────────────────
spring.data.redis.host=${SPRING_DATA_REDIS_HOST:localhost}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}
spring.data.redis.password=${SPRING_DATA_REDIS_PASSWORD:}
spring.data.redis.timeout=60s

# ── Mail ───────────────────────────────────────────────────────────────────────
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com

app.mail.from=${SPRING_MAIL_USERNAME:}
app.mail.from-name=${APP_MAIL_FROM_NAME:SH-POS System}

# ── AES Encryption ─────────────────────────────────────────────────────────────
app.encrypt.secret=${APP_ENCRYPT_SECRET:}
app.encrypt.iv=${APP_ENCRYPT_IV:}

# ── Jackson ────────────────────────────────────────────────────────────────────
spring.jackson.default-property-inclusion=non_null
spring.jackson.serialization.write-dates-as-timestamps=false

# ── Logging ────────────────────────────────────────────────────────────────────
logging.level.root=WARN
logging.level.com.sh.sh.pos=INFO
logging.level.org.springframework.cache=INFO
logging.level.org.springframework.data.redis.repository.config=OFF
logging.level.org.springframework.security=WARN

# Swagger UI path (default is /swagger-ui.html)
springdoc.swagger-ui.path=/swagger-ui.html
 
# API docs JSON path
springdoc.api-docs.path=/v3/api-docs
 
# Sort endpoints alphabetically
springdoc.swagger-ui.operationsSorter=alpha
springdoc.swagger-ui.tagsSorter=alpha
 
# Show actuator endpoints (optional)
springdoc.show-actuator=false
 
# Group APIs by package (optional, useful for large APIs)
springdoc.swagger-ui.disable-swagger-default-url=true

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration
spring.flyway.repair-on-migrate=true


# ── SonarQube project config ───────────────────────────────────────────────────
sonar.projectKey=sh-pos-system
sonar.projectName=SH-POS System
sonar.projectVersion=1.0
 
sonar.host.url=http://localhost:9000
 
sonar.sources=src/main/java
sonar.tests=src/test/java
sonar.java.binaries=target/classes
sonar.java.test.binaries=target/test-classes
sonar.token=squ_bb3327274055b5cc6968e491dcf50805d124c244
 
# JaCoCo coverage report
sonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml
 
# Exclusions — don't analyze generated/config code
sonar.exclusions=**/model/**,**/payload/dto/**,**/configuration/**
sonar.test.exclusions=**/ShPosSystemApplicationTests.java