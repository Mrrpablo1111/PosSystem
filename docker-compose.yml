services:

  # ── MySQL ───────────────────────────────────────────────────────────────────
  mysql:
    image: mysql:8.0
    container_name: sh-pos-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE:      ${DB_NAME}
      MYSQL_USER:          ${DB_USERNAME}
      MYSQL_PASSWORD:      ${DB_PASSWORD}
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - pos-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ── Redis ───────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: sh-pos-redis
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --appendonly yes
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - pos-network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Spring Boot ─────────────────────────────────────────────────────────────
  app:
    build: .
    container_name: sh-pos-app
    restart: unless-stopped
    ports:
      - "5500:5500"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL:      jdbc:mysql://mysql:3306/${DB_NAME}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      SPRING_DATA_REDIS_HOST:     redis
      SPRING_DATA_REDIS_PORT:     6379
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD}
      SPRING_MAIL_USERNAME:       ${MAIL_USERNAME}
      SPRING_MAIL_PASSWORD:       ${MAIL_PASSWORD}
      APP_MAIL_FROM_NAME:         ${MAIL_FROM_NAME}
      APP_ENCRYPT_SECRET:         ${APP_ENCRYPT_SECRET}
      APP_ENCRYPT_IV:             ${APP_ENCRYPT_IV}
    networks:
      - pos-network

  # ── SonarQube ────────────────────────────────────────────────────────────────
  sonarqube:
    image: sonarqube:lts-community
    container_name: sh-pos-sonar
    restart: unless-stopped
    ports:
      - "9000:9000"
    environment:
      SONAR_JDBC_URL:      jdbc:postgresql://sonar-db:5432/sonar
      SONAR_JDBC_USERNAME: sonar
      SONAR_JDBC_PASSWORD: sonar
    volumes:
      - sonar-data:/opt/sonarqube/data
      - sonar-logs:/opt/sonarqube/logs
      - sonar-extensions:/opt/sonarqube/extensions
    networks:
      - pos-network
    depends_on:
      - sonar-db
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9000/api/system/status"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # ── PostgreSQL for SonarQube ──────────────────────────────────────────────────
  sonar-db:
    image: postgres:15-alpine
    container_name: sh-pos-sonar-db
    restart: unless-stopped
    environment:
      POSTGRES_USER:     sonar
      POSTGRES_PASSWORD: sonar
      POSTGRES_DB:       sonar
    volumes:
      - sonar-db-data:/var/lib/postgresql/data
    networks:
      - pos-network

# ── Volumes ───────────────────────────────────────────────────────────────────
volumes:
  mysql-data:
    name: sh-pos-mysql-data
    driver: local
  redis-data:
    name: sh-pos-redis-data
    driver: local
  sonar-data:
    name: sh-pos-sonar-data
    driver: local
  sonar-logs:
    name: sh-pos-sonar-logs
    driver: local
  sonar-extensions:
    name: sh-pos-sonar-extensions
    driver: local
  sonar-db-data:
    name: sh-pos-sonar-db-data
    driver: local

# ── Networks ──────────────────────────────────────────────────────────────────
networks:
  pos-network:
    name: sh-pos-network
    driver: bridge